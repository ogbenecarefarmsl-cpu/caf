<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f17" />
    <meta name="description" content="CareFarm Point of Sale and Inventory Management" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CAREFARM" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>CAREFARM POS</title>
    <script>
      (function() {
        var RELOAD_KEY = 'caf_chunk_reload_ts';
        function handleStaleChunk() {
          try {
            var last = sessionStorage.getItem(RELOAD_KEY);
            var now = Date.now();
            if (!last || now - parseInt(last, 10) > 8000) {
              sessionStorage.setItem(RELOAD_KEY, now.toString());
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(regs) {
                  for (var i = 0; i < regs.length; i++) {
                    regs[i].unregister();
                  }
                });
              }
              if ('caches' in window) {
                caches.keys().then(function(keys) {
                  for (var i = 0; i < keys.length; i++) {
                    caches.delete(keys[i]);
                  }
                });
              }
              window.location.reload();
            }
          } catch (e) {}
        }
        window.addEventListener('vite:preloadError', handleStaleChunk);
        window.addEventListener('error', function(e) {
          var target = e.target;
          var msg = String((e && (e.message || (e.error && e.error.message))) || '');
          if (
            (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) ||
            msg.indexOf('Failed to load module') !== -1 ||
            msg.indexOf('text/html') !== -1 ||
            msg.indexOf('Loading chunk') !== -1
          ) {
            handleStaleChunk();
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
